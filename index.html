<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dice</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #6a1b9a;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        header {
            text-align: center;
            padding: 25px 20px 10px 20px;
            flex-shrink: 0;
        }

        h1 {
            font-family: 'Permanent Marker', cursive;
            color: #ffeb3b;
            font-size: 4.5rem;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 
                3px 3px 0px #000, 
                -1px -1px 0px #000,  
                1px -1px 0px #000,
                -1px 1px 0px #000,
                1px 1px 0px #000,
                5px 5px 10px rgba(0,0,0,0.6);
            transition: filter 0.3s ease;
        }

        .main-container {
            display: flex;
            flex: 1;
            justify-content: space-between;
            padding: 20px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sidebar {
            width: 320px;
            min-height: 280px; 
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            align-self: flex-start; 
            margin-top: 50px; 
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-family: 'Permanent Marker', cursive; 
            color: #ffeb3b;
            font-size: 1.8rem;
            border-bottom: 2px solid #ffeb3b;
            padding-bottom: 8px;
            margin-top: 0;
        }

        .streamer-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .streamer-list li {
            padding: 12px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .streamer-list a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.15rem; 
        }

        .streamer-list a:hover {
            text-decoration: underline;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-width: 300px;
        }

        .controls-top {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls-top select {
            padding: 5px 10px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .bg-upload-btn {
            background-color: #ffffff;
            color: #333;
            border: none;
            padding: 6px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dice-container {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }

        .dice {
            width: 95px;
            height: 95px;
            background-color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                3px 3px 0px rgba(0, 0, 0, 0.3),
                6px 6px 0px rgba(0, 0, 0, 0.2),
                9px 9px 15px rgba(0, 0, 0, 0.4),
                inset -4px -4px 12px rgba(0, 0, 0, 0.2),
                inset 4px 4px 12px rgba(255, 255, 255, 0.4);
            transition: background-color 0.15s, transform 0.1s, filter 0.3s ease;
        }

        .dot {
            display: block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #000000 !important;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.6);
        }

        button.roll-btn {
            font-family: 'Permanent Marker', cursive;
            background-color: #ffeb3b;
            color: #6a1b9a;
            border: none;
            padding: 12px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        /* WEISSES OVERLAY MIT DREHENDEM WÜRFEL */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .overlay.active {
            display: flex;
        }

        .overlay-dice {
            width: 120px;
            height: 120px;
            background: #ffeb3b;
            border: 4px solid #000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: spinAndScale 0.8s infinite ease-in-out;
        }

        .overlay-dice .dot {
            width: 28px;
            height: 28px;
        }

        @keyframes spinAndScale {
            0% { transform: rotate(0deg) scale(0.8); }
            50% { transform: rotate(180deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(0.8); }
        }

        /* COLOR POPUP PANEL */
        .color-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffeb3b;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            width: 200px;
            text-align: center;
        }

        .color-popup.open {
            display: flex;
        }

        .color-popup h3 {
            margin: 0;
            font-size: 0.95rem;
            color: #ffeb3b;
        }

        .color-toggle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .toggle-btn {
            padding: 6px 8px;
            border: 1.5px solid white;
            background: transparent;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.78rem;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: white;
            color: black;
        }

        /* BUTTON UNTEN LINKS & BLUR KLASSE */
        .hide-name-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffeb3b;
            color: #ffeb3b;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Permanent Marker', cursive;
            font-size: 1rem;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .hide-name-btn:hover {
            background: #ffeb3b;
            color: #000;
        }

        .blurred {
            filter: blur(12px) !important;
            user-select: none;
        }

        .color-red { background: radial-gradient(circle at 35% 35%, #ff5252, #ff1744) !important; }
        .color-green { background: radial-gradient(circle at 35% 35%, #69f0ae, #00e676) !important; }
        .color-blue { background: radial-gradient(circle at 35% 35%, #448aff, #2979ff) !important; }
        .color-yellow { background: radial-gradient(circle at 35% 35%, #ffff8d, #ffea00) !important; }
        .color-purple { background: radial-gradient(circle at 35% 35%, #e040fb, #d500f9) !important; }
        .color-orange { background: radial-gradient(circle at 35% 35%, #ffab40, #ff9100) !important; }
    </style>
</head>
<body>

    <div id="roll-overlay" class="overlay">
        <div class="overlay-dice">
            <span class="dot"></span>
        </div>
    </div>

    <header>
        <h1 id="site-title">Online Dice</h1>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <h2>Top Streamer</h2>
            <ul class="streamer-list">
                <li><a href="https://tiktok.com/@kriptix01" target="_blank">kriptix01</a></li>
            </ul>
        </div>

        <div class="game-area">
            <div class="controls-top">
                <div>
                    <label for="dice-count">Würfel Anzahl:</label>
                    <select id="dice-count" onchange="updateDiceCount()">
                        <option value="1">1 Würfel</option>
                        <option value="2">2 Würfel</option>
                        <option value="3">3 Würfel</option>
                        <option value="4" selected>4 Würfel</option>
                        <option value="5">5 Würfel</option>
                        <option value="6">6 Würfel</option>
                    </select>
                </div>
                
                <input type="file" id="bg-input" accept="image/*" style="display: none;" onchange="changeBackground(this)">
                <button class="bg-upload-btn" onclick="document.getElementById('bg-input').click()">Hintergrundbild ändern</button>
            </div>

            <div id="dice-container" class="dice-container"></div>
            
            <button id="roll-button" class="roll-btn" onclick="startRoll()">Würfeln</button>
        </div>

        <div class="sidebar">
            <h2>Top Streamer</h2>
            <ul class="streamer-list">
                <li><a href="https://tiktok.com/@nexo_142012" target="_blank">nexo_142012</a></li>
            </ul>
        </div>
    </div>

    <button class="hide-name-btn" onclick="toggleHideName()">Hide Name</button>

    <div id="color-popup-menu" class="color-popup">
        <h3>Farben (Menü: P)</h3>
        <div class="color-toggle-grid">
            <button id="btn-red" class="toggle-btn active" onclick="toggleColor('red')">Rot [R]</button>
            <button id="btn-green" class="toggle-btn active" onclick="toggleColor('green')">Grün [N]</button>
            <button id="btn-blue" class="toggle-btn active" onclick="toggleColor('blue')">Blau [B]</button>
            <button id="btn-yellow" class="toggle-btn active" onclick="toggleColor('yellow')">Gelb [G]</button>
            <button id="btn-purple" class="toggle-btn active" onclick="toggleColor('purple')">Purple [L]</button>
            <button id="btn-orange" class="toggle-btn active" onclick="toggleColor('orange')">Orange [O]</button>
        </div>
    </div>

    <script>
        let isNameHidden = false;

        const allowedColors = {
            red: true, green: true, blue: true, yellow: true, purple: true, orange: true
        };

        // Name & Farben verschwommen schalten
        function toggleHideName() {
            isNameHidden = !isNameHidden;
            const title = document.getElementById('site-title');
            const container = document.getElementById('dice-container');

            if (isNameHidden) {
                title.classList.add('blurred');
                container.classList.add('blurred');
            } else {
                title.classList.remove('blurred');
                container.classList.remove('blurred');
            }
        }

        // Tastatur-Shortcuts
        document.addEventListener('keydown', function(event) {
            const key = event.key.toLowerCase();

            if (key === 'p') {
                const popup = document.getElementById('color-popup-menu');
                popup.classList.toggle('open');
            } else if (key === 'r') {
                toggleColor('red');
            } else if (key === 'g') {
                toggleColor('yellow');
            } else if (key === 'l') {
                toggleColor('purple');
            } else if (key === 'b') {
                toggleColor('blue');
            } else if (key === 'n') {
                toggleColor('green');
            } else if (key === 'o') {
                toggleColor('orange');
            }
        });

        function toggleColor(colorName) {
            // REGEL: Es muss immer mindestens eine Farbe aktiv bleiben!
            const activeCount = Object.values(allowedColors).filter(v => v === true).length;
            if (allowedColors[colorName] && activeCount <= 1) {
                alert("Es muss mindestens eine Farbe aktiv bleiben!");
                return;
            }

            allowedColors[colorName] = !allowedColors[colorName];
            const btn = document.getElementById(`btn-${colorName}`);
            if (allowedColors[colorName]) {
                btn.classList.add('active');
                btn.style.opacity = "1";
            } else {
                btn.classList.remove('active');
                btn.style.opacity = "0.4";
            }
        }

        function changeBackground(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = `url('${e.target.result}')`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function updateDiceCount() {
            const count = parseInt(document.getElementById('dice-count').value);
            const container = document.getElementById('dice-container');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const dice = document.createElement('div');
                dice.className = 'dice';
                dice.id = `dice-${i}`;
                
                const dot = document.createElement('span');
                dot.className = 'dot';
                dice.appendChild(dot);
                
                container.appendChild(dice);
            }
            applyDiceLogic();
        }

        function playDiceSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(120 + Math.random() * 80, audioCtx.currentTime);
                        
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.08);
                    }, i * 100);
                }
            } catch (e) {
                console.log("Audio nicht verfügbar.");
            }
        }

        function startRoll() {
            const rollBtn = document.getElementById('roll-button');
            const overlay = document.getElementById('roll-overlay');
            
            rollBtn.disabled = true;
            overlay.classList.add('active');
            playDiceSound();

            setTimeout(() => {
                applyDiceLogic();
                overlay.classList.remove('active');
                rollBtn.disabled = false;
            }, 800);
        }

        function applyDiceLogic() {
            const container = document.getElementById('dice-container');
            const dices = container.getElementsByClassName('dice');
            const totalDice = dices.length;

            const currentPool = [];
            for (const color in allowedColors) {
                if (allowedColors[color]) currentPool.push(color);
            }

            if (currentPool.length === 0) return;

            let finalColors = [];

            if (totalDice === 4) {
                const rand = Math.random() * 100;

                let matchCount = 1;
                if (rand <= 0.77) {
                    matchCount = 4;
                } else if (rand <= 0.77 + 15) {
                    matchCount = 3;
                } else if (rand <= 0.77 + 15 + 40) {
                    matchCount = 2;
                } else {
                    matchCount = 1;
                }

                const primaryColor = currentPool[Math.floor(Math.random() * currentPool.length)];
                for (let i = 0; i < matchCount; i++) {
                    finalColors.push(primaryColor);
                }

                const remainingPool = currentPool.filter(c => c !== primaryColor);
                while (finalColors.length < totalDice) {
                    if (remainingPool.length > 0) {
                        const randomAltColor = remainingPool[Math.floor(Math.random() * remainingPool.length)];
                        finalColors.push(randomAltColor);
                    } else {
                        finalColors.push(primaryColor);
                    }
                }
            } else {
                for (let i = 0; i < totalDice; i++) {
                    finalColors.push(currentPool[Math.floor(Math.random() * currentPool.length)]);
                }
            }

            for (let i = finalColors.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [finalColors[i], finalColors[j]] = [finalColors[j], finalColors[i]];
            }

            for (let i = 0; i < dices.length; i++) {
                dices[i].className = 'dice';
                dices[i].classList.add(`color-${finalColors[i]}`);
            }
        }

        updateDiceCount();
    </script>
</body>
</html>
